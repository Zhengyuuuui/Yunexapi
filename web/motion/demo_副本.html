<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apple Ring Demo</title>
  <style>
    :root {
      --stage-w: 854px;
      --stage-h: 624px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f4f4f4;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .stage {
      position: relative;
      width: min(var(--stage-w), 100vw);
      aspect-ratio: 854 / 624;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
    }

    .stage::before,
    .stage::after {
      position: absolute;
      top: 0;
      z-index: 3;
      width: 12px;
      height: 100%;
      background: #050505;
      content: "";
    }

    .stage::before {
      left: 0;
    }

    .stage::after {
      right: 0;
    }

    .orb-field {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      filter: blur(1px);
    }

    .dot {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      background: var(--color);
      opacity: var(--alpha);
      transform: translate(-50%, -50%);
    }

    .apple {
      position: absolute;
      left: 50%;
      top: 54%;
      z-index: 2;
      width: 126px;
      height: 126px;
      transform: translate(-50%, -50%);
      color: #000;
      filter: blur(0.15px);
    }

    .apple svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 860px) {
      .stage {
        box-shadow: none;
      }
    }
  </style>
</head>
